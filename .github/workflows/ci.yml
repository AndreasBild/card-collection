name: CI Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java (JDK 26)
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Build and Test Suite
        run: ./mvnw clean verify -B

