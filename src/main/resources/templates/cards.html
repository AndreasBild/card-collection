<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Juwan Howard Basketball Trading Card Collection</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#317EFB">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="194x194" href="/favicon/favicon-194x194.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#317EFB">
    <meta name="apple-mobile-web-app-title" content="Maulmann.de">
    <meta name="application-name" content="Maulmann.de">
    <meta name="msapplication-TileColor" content="#317EFB">
    <link href="/favicon/favicon.ico" rel="icon" sizes="32x32">
    <link href="/favicon/apple-touch-icon.png" rel="apple-touch-icon">
    <meta name="description"
          content="Private Collection of Juwan Howard Basketball Trading Cards. Containing many 1/1 and rare Trading Cards from companies like: Panini, Fleer, Topps and Upper Deck. Including Super rare cards like Precious Metal Gems from the 90s">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../css/main.css" rel="stylesheet" type="text/css">
    <meta name="robots" content="index,follow">
</head>
<body>
<h1>Sports Card Collection</h1>
<form th:action="@{/cards}" method="GET" class="filter-form">
    <div>
        <label for="manufacturerSelectForm">Vendor/Manufacturer:</label>
        <select id="manufacturerSelectForm" name="manufacturerId" class="styled-select">
            <option value="">All Manufacturers</option>
            <option th:each="man : ${manufacturers}"
                    th:value="${man.id}"
                    th:text="${man.name}"
                    th:selected="${param.manufacturerId != null && param.manufacturerId == man.id}"></option>
        </select>
    </div>
    <div>
        <label for="brandSelectForm">Brand:</label>
        <select id="brandSelectForm" name="brandId" class="styled-select">
            <option value="">All Brands</option>
            <option th:each="brand : ${brands}"
                    th:value="${brand.id}"
                    th:text="${brand.name}"
                    th:selected="${param.brandId != null && param.brandId == brand.id}"></option>
        </select>
    </div>
    <div>
        <label for="themeSelectForm">Theme:</label>
        <select id="themeSelectForm" name="themeId" class="styled-select">
            <option value="">All Themes</option>
            <option th:each="theme : ${themes}"
                    th:value="${theme.id}"
                    th:text="${theme.name}"
                    th:selected="${param.themeId != null && param.themeId == theme.id}"></option>
        </select>
    </div>
    <div>
        <label for="sportSelectForm">Sport:</label>
        <select id="sportSelectForm" name="sportId" class="styled-select">
            <option value="">All Sports</option>
            <option th:each="sport : ${sports}"
                    th:value="${sport.id}"
                    th:text="${sport.name}"
                    th:selected="${param.sportId != null && param.sportId == sport.id}"></option>
        </select>
    </div>
    <div>
        <label for="playerSelectForm">Player:</label>
        <select id="playerSelectForm" name="playerId" class="styled-select">
            <option value="">All Players</option>
            <option th:each="player : ${players}"
                    th:value="${player.id}"
                    th:text="${player.name + ' ' + player.surname}"
                    th:selected="${param.playerId != null && param.playerId == player.id}"></option>
        </select>
    </div>
    <div>
        <label for="teamSelectForm">Team:</label>
        <select id="teamSelectForm" name="teamId" class="styled-select">
            <option value="">All Teams</option>
            <option th:each="team : ${teams}"
                    th:value="${team.id}"
                    th:text="${team.name}"
                    th:selected="${param.teamId != null && param.teamId == team.id}"></option>
        </select>
    </div>
    <div>
        <label for="seasonSelectForm">Season:</label>
        <select id="seasonSelectForm" name="seasonId" class="styled-select">
            <option value="">All Seasons</option>
            <option th:each="s : ${seasons}"
                    th:value="${s.id}"
                    th:text="${s.name}"
                    th:selected="${param.seasonId != null && param.seasonId == s.id}"></option>
        </select>
    </div>
    <div>
        <label for="gameUsedSelectForm">Game Used:</label>
        <select id="gameUsedSelectForm" name="gameUsed" class="styled-select">
            <option value="">Any</option>
            <option value="true" th:selected="${param.gameUsed == 'true'}">Yes</option>
            <option value="false" th:selected="${param.gameUsed == 'false'}">No</option>
        </select>
    </div>
    <div>
        <label for="autographSelectForm">Autograph:</label>
        <select id="autographSelectForm" name="autograph" class="styled-select">
            <option value="">Any</option>
            <option value="true" th:selected="${param.autograph == 'true'}">Yes</option>
            <option value="false" th:selected="${param.autograph == 'false'}">No</option>
        </select>
    </div>
    <div>
        <label for="variantSelectForm">Variant:</label>
        <select id="variantSelectForm" name="variantId" class="styled-select">
            <option value="">All Variants</option>
            <option th:each="variant : ${variants}"
                    th:value="${variant.id}"
                    th:text="${variant.name}"
                    th:selected="${param.variantId != null && param.variantId == variant.id}"></option>
        </select>
    </div>
    <div>
        <label for="rookieCardSelectForm">Rookie:</label>
        <select id="rookieCardSelectForm" name="rookieCard" class="styled-select">
            <option value="">Any</option>
            <option value="true" th:selected="${param.rookieCard == 'true'}">Yes</option>
            <option value="false" th:selected="${param.rookieCard == 'false'}">No</option>
        </select>
    </div>
    <div>
        <label for="printRunRangeSelectForm">Print Run:</label>
        <select id="printRunRangeSelectForm" name="printRunRangeKey" class="styled-select">
            <option value="">Any</option>
            <option th:each="prRange : ${printRunRanges}"
                    th:value="${prRange.key}"
                    th:text="${prRange.displayName}"
                    th:selected="${param.printRunRangeKey != null && param.printRunRangeKey == prRange.key}"></option>
        </select>
    </div>
    <div>
        <label for="gradingStatusSelectForm">Graded:</label>
        <select id="gradingStatusSelectForm" name="isGradedNullable" class="styled-select">
            <option value="">Any</option>
            <option value="true" th:selected="${param.isGradedNullable == 'true'}">Yes</option>
            <option value="false" th:selected="${param.isGradedNullable == 'false'}">No</option>
        </select>
    </div>
    <div class="filter-buttons-container">
        <button type="submit">Filter</button>
        <a th:href="@{/cards}" class="button">Clear Filters</a>
    </div>
</form>
<!-- End New Filter Form -->
<table>
    <thead>
    <tr>
        <th:block th:each="column : ${sortableColumns}">
            <th th:aria-sort="${column.isSortable && currentSortProperty == column.propertyPath ? (currentSortDirection == 'ASC' ? 'ascending' : 'descending') : 'none'}">
                <a th:if="${column.isSortable}"
                   th:with="nextSortDir=${currentSortProperty == column.propertyPath && currentSortDirection == 'ASC' ? 'DESC' : 'ASC'}"
                   th:aria-label="'Sort by ' + column.displayName +
                                  (${currentSortProperty == column.propertyPath && currentSortDirection == 'ASC'} ?
                                   ', currently sorted ascending, activate to sort descending' :
                                   (${currentSortProperty == column.propertyPath && currentSortDirection == 'DESC'} ?
                                    ', currently sorted descending, activate to sort ascending' :
                                    ', activate to sort ascending'))"
                   th:href="@{/cards(
                        page=0, size=${pageSize},
                        sort=${column.propertyPath + ',' + nextSortDir},
                        manufacturerId=${param.manufacturerId ?: ''}, brandId=${param.brandId ?: ''}, themeId=${param.themeId ?: ''},
                        sportId=${param.sportId ?: ''}, playerId=${param.playerId ?: ''}, teamId=${param.teamId ?: ''},
                        seasonId=${param.seasonId ?: ''}, gameUsed=${param.gameUsed ?: ''}, autograph=${param.autograph ?: ''},
                        variantId=${param.variantId ?: ''}, rookieCard=${param.rookieCard ?: ''}, printRunRangeKey=${param.printRunRangeKey ?: ''},
                        isGradedNullable=${param.isGradedNullable ?: ''}
                   )}">
                    <span th:text="${column.displayName}"></span>
                    <span th:if="${currentSortProperty == column.propertyPath}">
                        <span th:if="${currentSortDirection == 'ASC'}">▲</span>
                        <span th:if="${currentSortDirection == 'DESC'}">▼</span>
                    </span>
                </a>
                <span th:unless="${column.isSortable}" th:text="${column.displayName}"></span>
            </th>
        </th:block>
    </tr>
    </thead>
    <tbody>
    <tr th:each="card : ${cards}">
        <td th:text="${card.playerNames}"></td>
        <td th:text="${card.teamNames}"></td>
        <td th:text="${card.sportNames}"></td>
        <td th:text="${card?.season?.name}"></td>
        <td th:text="${card?.manufacturer?.name}"></td>
        <td th:text="${card?.brand?.name}"></td>
        <td th:text="${card?.theme?.name}"></td>
        <td th:text="${card.variant.name}"></td>
        <td th:text="${card.number}"></td>
        <td th:text="${card.serialNumber}"></td>
        <td th:text="${card.printRun}"></td>
        <td th:text="${card.rookieCard ? 'Yes' : 'No'}"></td>
        <td th:text="${card.gameUsedMaterial ? 'Yes' : 'No'}"></td>
        <td th:text="${card.autograph ? 'Yes' : 'No'}"></td>
        <td th:text="${card.grading?.gradingCompany?.name()}"></td>
        <td th:text="${card.grading?.grade}"></td>
    </tr>
    </tbody>
</table>
<!-- Pagination Controls -->
<div th:if="${totalPages > 0}" class="pagination-controls">
    <div class="pagination-info-block">
        Rows per page:
        <label for="pageSizeSelector"></label><select id="pageSizeSelector" onchange="changePageSize()"
                                                      class="styled-select">
        <option th:each="s : ${#numbers.sequence(10, 100)}" th:if="${s == 10 || s == 20 || s == 50 || s == 100}"
                th:value="${s}" th:text="${s}" th:selected="${s == pageSize}">_
        </option>
    </select>
    </div>
    <div class="pagination-info-block">
        Page <span th:text="${currentPage + 1}">_</span> of <span th:text="${totalPages}">_</span>.
        Total items: <span th:text="${totalItems}">_</span>.
    </div>
    <nav>
        <ul class="pagination">
            <li th:classappend="${currentPage == 0} ? 'disabled' : ''">
                <a th:href="@{/cards(page=0, size=${pageSize},
                                sort=${param.sort ?: ''},
                                manufacturerId=${param.manufacturerId ?: ''},
                                brandId=${param.brandId ?: ''},
                                themeId=${param.themeId ?: ''},
                                sportId=${param.sportId ?: ''},
                                playerId=${param.playerId ?: ''},
                                teamId=${param.teamId ?: ''},
                                seasonId=${param.seasonId ?: ''},
                                gameUsed=${param.gameUsed ?: ''},
                                autograph=${param.autograph ?: ''},
                                variantId=${param.variantId ?: ''},
                                rookieCard=${param.rookieCard ?: ''},
                                printRunRangeKey=${param.printRunRangeKey ?: ''},
                                isGradedNullable=${param.isGradedNullable ?: ''}
                                )}">First</a>
            </li>
            <li th:classappend="${currentPage == 0} ? 'disabled' : ''">
                <a th:href="@{/cards(page=${currentPage - 1}, size=${pageSize},
                                sort=${param.sort ?: ''},
                                manufacturerId=${param.manufacturerId ?: ''},
                                brandId=${param.brandId ?: ''},
                                themeId=${param.themeId ?: ''},
                                sportId=${param.sportId ?: ''},
                                playerId=${param.playerId ?: ''},
                                teamId=${param.teamId ?: ''},
                                seasonId=${param.seasonId ?: ''},
                                gameUsed=${param.gameUsed ?: ''},
                                autograph=${param.autograph ?: ''},
                                variantId=${param.variantId ?: ''},
                                rookieCard=${param.rookieCard ?: ''},
                                printRunRangeKey=${param.printRunRangeKey ?: ''},
                                isGradedNullable=${param.isGradedNullable ?: ''}
                                )}"
                   th:unless="${currentPage == 0}">Previous</a>
                <span th:if="${currentPage == 0}">Previous</span>
            </li>
            <th:block th:with="window=2">
                <th:block th:if="${totalPages <= (2 * window + 5)}">
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active' : ''">
                        <a th:href="@{/cards(page=${i}, size=${pageSize},
                                        sort=${param.sort ?: ''},
                                        manufacturerId=${param.manufacturerId ?: ''},
                                        brandId=${param.brandId ?: ''},
                                        themeId=${param.themeId ?: ''},
                                        sportId=${param.sportId ?: ''},
                                        playerId=${param.playerId ?: ''},
                                        teamId=${param.teamId ?: ''},
                                        seasonId=${param.seasonId ?: ''},
                                        gameUsed=${param.gameUsed ?: ''},
                                        autograph=${param.autograph ?: ''},
                                        variantId=${param.variantId ?: ''},
                                        rookieCard=${param.rookieCard ?: ''},
                                        printRunRangeKey=${param.printRunRangeKey ?: ''},
                                        isGradedNullable=${param.isGradedNullable ?: ''}
                                        )}" th:text="${i + 1}">_</a>
                    </li>
                </th:block>
                <th:block th:unless="${totalPages <= (2 * window + 5)}">
                    <li th:classappend="${0 == currentPage} ? 'active' : ''">
                        <a th:href="@{/cards(page=0, size=${pageSize}, sort=${param.sort ?: ''}, manufacturerId=${param.manufacturerId ?: ''}, brandId=${param.brandId ?: ''}, themeId=${param.themeId ?: ''}, sportId=${param.sportId ?: ''}, playerId=${param.playerId ?: ''}, teamId=${param.teamId ?: ''}, seasonId=${param.seasonId ?: ''}, gameUsed=${param.gameUsed ?: ''}, autograph=${param.autograph ?: ''}, variantId=${param.variantId ?: ''}, rookieCard=${param.rookieCard ?: ''}, printRunRangeKey=${param.printRunRangeKey ?: ''}, isGradedNullable=${param.isGradedNullable ?: ''})}"
                           th:text="1">_</a>
                    </li>
                    <li th:if="${currentPage > window + 1}" class="disabled"><span>...</span></li>
                    <li th:each="i : ${#numbers.sequence( T(java.lang.Math).max(1, currentPage.intValue() - 1), T(java.lang.Math).min(totalPages.intValue() - 2, currentPage.intValue() + 1) )}"
                        th:classappend="${i == currentPage} ? 'active' : ''">
                        <a th:href="@{/cards(page=${i}, size=${pageSize},
                                        sort=${param.sort ?: ''},
                                        manufacturerId=${param.manufacturerId ?: ''},
                                        brandId=${param.brandId ?: ''},
                                        themeId=${param.themeId ?: ''},
                                        sportId=${param.sportId ?: ''},
                                        playerId=${param.playerId ?: ''},
                                        teamId=${param.teamId ?: ''},
                                        seasonId=${param.seasonId ?: ''},
                                        gameUsed=${param.gameUsed ?: ''},
                                        autograph=${param.autograph ?: ''},
                                        variantId=${param.variantId ?: ''},
                                        rookieCard=${param.rookieCard ?: ''},
                                        printRunRangeKey=${param.printRunRangeKey ?: ''},
                                        isGradedNullable=${param.isGradedNullable ?: ''}
                                        )}" th:text="${i + 1}">_</a>
                    </li>
                    <li th:if="${currentPage < totalPages - window - 2}" class="disabled"><span>...</span></li>
                    <li th:classappend="${totalPages - 1 == currentPage} ? 'active' : ''">
                        <a th:href="@{/cards(page=${totalPages - 1}, size=${pageSize}, sort=${param.sort ?: ''}, manufacturerId=${param.manufacturerId ?: ''}, brandId=${param.brandId ?: ''}, themeId=${param.themeId ?: ''}, sportId=${param.sportId ?: ''}, playerId=${param.playerId ?: ''}, teamId=${param.teamId ?: ''}, seasonId=${param.seasonId ?: ''}, gameUsed=${param.gameUsed ?: ''}, autograph=${param.autograph ?: ''}, variantId=${param.variantId ?: ''}, rookieCard=${param.rookieCard ?: ''}, printRunRangeKey=${param.printRunRangeKey ?: ''}, isGradedNullable=${param.isGradedNullable ?: ''})}"
                           th:text="${totalPages}">_</a>
                    </li>
                </th:block>
            </th:block>
            <li th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                <a th:href="@{/cards(page=${currentPage + 1}, size=${pageSize},
                                sort=${param.sort ?: ''},
                                manufacturerId=${param.manufacturerId ?: ''},
                                brandId=${param.brandId ?: ''},
                                themeId=${param.themeId ?: ''},
                                sportId=${param.sportId ?: ''},
                                playerId=${param.playerId ?: ''},
                                teamId=${param.teamId ?: ''},
                                seasonId=${param.seasonId ?: ''},
                                gameUsed=${param.gameUsed ?: ''},
                                autograph=${param.autograph ?: ''},
                                variantId=${param.variantId ?: ''},
                                rookieCard=${param.rookieCard ?: ''},
                                printRunRangeKey=${param.printRunRangeKey ?: ''},
                                isGradedNullable=${param.isGradedNullable ?: ''}
                                )}"
                   th:unless="${currentPage >= totalPages - 1}">Next</a>
                <span th:if="${currentPage >= totalPages - 1}">Next</span>
            </li>
            <li th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                <a th:href="@{/cards(page=${totalPages - 1}, size=${pageSize},
                                sort=${param.sort ?: ''},
                                manufacturerId=${param.manufacturerId ?: ''},
                                brandId=${param.brandId ?: ''},
                                themeId=${param.themeId ?: ''},
                                sportId=${param.sportId ?: ''},
                                playerId=${param.playerId ?: ''},
                                teamId=${param.teamId ?: ''},
                                seasonId=${param.seasonId ?: ''},
                                gameUsed=${param.gameUsed ?: ''},
                                autograph=${param.autograph ?: ''},
                                variantId=${param.variantId ?: ''},
                                rookieCard=${param.rookieCard ?: ''},
                                printRunRangeKey=${param.printRunRangeKey ?: ''},
                                isGradedNullable=${param.isGradedNullable ?: ''}
                                )}">Last</a>
            </li>
        </ul>
    </nav>
</div>
<!-- End Pagination Controls -->
<script>
    /*<![CDATA[*/
    function changePageSize() {
        const selectedSize = document.getElementById('pageSizeSelector').value;
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set('size', selectedSize);
        currentUrl.searchParams.set('page', '0'); // Reset to first page
        window.location.href = currentUrl.toString();
    }

    document.addEventListener('DOMContentLoaded', function () {
        const manufacturerSelect = document.getElementById('manufacturerSelectForm');
        const brandSelect = document.getElementById('brandSelectForm');
        const themeSelect = document.getElementById('themeSelectForm');
        const variantSelect = document.getElementById('variantSelectForm');

        const initialBrandId = /*[[${param.brandId}]]*/ null;
        const initialThemeId = /*[[${param.themeId}]]*/ null;
        const initialVariantId = /*[[${param.variantId}]]*/ null;

        function updateDropdown(selectElement, options, selectedValue, defaultOptionText) {
            selectElement.innerHTML = ''; // Clear existing options

            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = defaultOptionText;
            selectElement.appendChild(defaultOption);

            options.forEach(function (optionData) {
                const option = document.createElement('option');
                option.value = optionData.id;
                option.textContent = optionData.name;
                if (selectedValue && optionData.id.toString() === selectedValue.toString()) {
                    option.selected = true;
                }
                selectElement.appendChild(option);
            });
        }

        async function fetchAndPopulateBrands(manufacturerId, selectedBrandId) {
            const url = manufacturerId ? `/api/filters/brands?manufacturerId=${manufacturerId}` : '/api/filters/brands';
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    console.error('Failed to fetch brands:', response.status, await response.text());
                    updateDropdown(brandSelect, [], selectedBrandId, 'All Brands'); // Clear or show error
                    return;
                }
                const brands = await response.json();
                const defaultText = manufacturerId ? 'All Brands (for selected Manufacturer)' : 'All Brands';
                updateDropdown(brandSelect, brands, selectedBrandId, defaultText);
            } catch (error) {
                console.error('Error fetching brands:', error);
                updateDropdown(brandSelect, [], selectedBrandId, 'All Brands'); // Clear on error
            }
        }

        async function fetchAndPopulateThemes(manufacturerId, brandId, selectedThemeId) {
            let url = '/api/filters/themes';
            const params = new URLSearchParams();
            if (brandId) {
                params.append('brandId', brandId);
            } else if (manufacturerId) {
                params.append('manufacturerId', manufacturerId);
            }

            if (params.toString()) {
                url += '?' + params.toString();
            }

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    console.error('Failed to fetch themes:', response.status, await response.text());
                    updateDropdown(themeSelect, [], selectedThemeId, 'All Themes'); // Clear or show error
                    return;
                }
                const themes = await response.json();
                let defaultText = 'All Themes';
                if (brandId) {
                    defaultText = 'All Themes (for selected Brand)';
                } else if (manufacturerId) {
                    defaultText = 'All Themes (for selected Manufacturer)';
                }
                updateDropdown(themeSelect, themes, selectedThemeId, defaultText);
            } catch (error) {
                console.error('Error fetching themes:', error);
                updateDropdown(themeSelect, [], selectedThemeId, 'All Themes');
            }
        }

        async function fetchAndPopulateVariants(manufacturerId, brandId, themeId, selectedVariantId) {
            let url = '/api/filters/variants';
            const params = new URLSearchParams();
            if (manufacturerId) params.append('manufacturerId', manufacturerId);
            if (brandId) params.append('brandId', brandId);
            if (themeId) params.append('themeId', themeId);

            if (params.toString()) {
                url += '?' + params.toString();
            }

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    console.error('Failed to fetch variants:', response.status, await response.text());
                    updateDropdown(variantSelect, [], selectedVariantId, 'All Variants');
                    return;
                }
                const variants = await response.json();
                let defaultText = 'All Variants';
                if (themeId) {
                    defaultText = 'All Variants (for selected Theme)';
                } else if (brandId) {
                    defaultText = 'All Variants (for selected Brand)';
                } else if (manufacturerId) {
                    defaultText = 'All Variants (for selected Manufacturer)';
                }
                updateDropdown(variantSelect, variants, selectedVariantId, defaultText);
            } catch (error) {
                console.error('Error fetching variants:', error);
                updateDropdown(variantSelect, [], selectedVariantId, 'All Variants');
            }
        }

        manufacturerSelect.addEventListener('change', async function () {
            const selectedManufacturerId = this.value;
            await fetchAndPopulateBrands(selectedManufacturerId, brandSelect.value);
            await fetchAndPopulateThemes(selectedManufacturerId, null, themeSelect.value);
            await fetchAndPopulateVariants(selectedManufacturerId, null, null, variantSelect.value);

            if (!selectedManufacturerId) {
                brandSelect.value = '';
                themeSelect.value = '';
                variantSelect.value = '';
                await fetchAndPopulateBrands(null, null);
                await fetchAndPopulateThemes(null, null, null);
                await fetchAndPopulateVariants(null, null, null, null);
            }
        });

        brandSelect.addEventListener('change', async function () {
            const selectedBrandId = this.value;
            const selectedManufacturerId = manufacturerSelect.value;
            await fetchAndPopulateThemes(selectedManufacturerId, selectedBrandId, themeSelect.value);
            await fetchAndPopulateVariants(selectedManufacturerId, selectedBrandId, null, variantSelect.value);

            if (!selectedBrandId) {
                if (selectedManufacturerId) {
                    await fetchAndPopulateThemes(selectedManufacturerId, null, themeSelect.value);
                    await fetchAndPopulateVariants(selectedManufacturerId, null, null, variantSelect.value);
                } else {
                    await fetchAndPopulateThemes(null, null, themeSelect.value);
                    await fetchAndPopulateVariants(null, null, null, variantSelect.value);
                }
            }
        });

        themeSelect.addEventListener('change', async function () {
            const selectedThemeId = this.value;
            const selectedBrandId = brandSelect.value;
            const selectedManufacturerId = manufacturerSelect.value;
            await fetchAndPopulateVariants(selectedManufacturerId, selectedBrandId, selectedThemeId, variantSelect.value);

            if (!selectedThemeId) {
                await fetchAndPopulateVariants(selectedManufacturerId, selectedBrandId, null, variantSelect.value);
            }
        });

        async function initializeFilters() {
            let currentManufacturerId = manufacturerSelect.value;
            let currentBrandId = brandSelect.value;
            let currentThemeId = themeSelect.value;

            if (currentManufacturerId) {
                await fetchAndPopulateBrands(currentManufacturerId, initialBrandId);
                currentBrandId = brandSelect.value;
                await fetchAndPopulateThemes(currentManufacturerId, currentBrandId, initialThemeId);
                currentThemeId = themeSelect.value;
                await fetchAndPopulateVariants(currentManufacturerId, currentBrandId, currentThemeId, initialVariantId);
            } else {
                if (initialBrandId) {
                    await fetchAndPopulateThemes(null, initialBrandId, initialThemeId);
                    currentThemeId = themeSelect.value;
                    await fetchAndPopulateVariants(null, initialBrandId, currentThemeId, initialVariantId);
                } else if (initialThemeId) {
                    await fetchAndPopulateVariants(null, null, initialThemeId, initialVariantId);
                } else {
                    if (initialVariantId) {
                        await fetchAndPopulateVariants(null, null, null, initialVariantId);
                    }
                }
            }
        }

        initializeFilters();
    });
    /*]]>*/
</script>
