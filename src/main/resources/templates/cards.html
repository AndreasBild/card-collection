<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Juwan Howard Basketball Trading Card Collection</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#317EFB">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="194x194" href="/favicon-194x194.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#317EFB">
    <meta name="apple-mobile-web-app-title" content="Maulmann.de">
    <meta name="application-name" content="Maulmann.de">
    <meta name="msapplication-TileColor" content="#317EFB">
    <link href="/favicon.ico" rel="icon" sizes="32x32">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <meta name="description"
          content="Private Collection of Juwan Howard Basketball Trading Cards. Containing many 1/1 and rare Trading Cards from companies like: Panini, Fleer, Topps and Upper Deck. Including Super rare cards like Precious Metal Gems from the 90s">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../css/main.css" rel="stylesheet" type="text/css">
    <meta name="robots" content="index,follow">
    <style>
        .filter-form div { margin-bottom: 10px; }
        .filter-form label { margin-right: 5px; }
        .filter-form select { padding: 5px; }
        .filter-form button { padding: 8px 15px; }
        .filter-form .button { text-decoration: none; padding: 8px 15px; background-color: #f0f0f0; color: #333; border: 1px solid #ccc; border-radius: 4px; }
        .filter-form .button:hover { background-color: #e0e0e0; }
    </style>
</head>
<body>
<h1>Card Collection</h1>

<!-- New Filter Form -->
<form th:action="@{/cards}" method="GET" class="filter-form">
    <div>
        <label for="manufacturerSelectForm">Vendor/Manufacturer:</label>
        <select id="manufacturerSelectForm" name="manufacturerId">
            <option value="">All Manufacturers</option>
            <option th:each="man : ${manufacturers}"
                    th:value="${man.id}"
                    th:text="${man.name}"
                    th:selected="${param.manufacturerId != null && param.manufacturerId == man.id}"></option>
        </select>
    </div>

    <div>
        <label for="brandSelectForm">Brand:</label>
        <select id="brandSelectForm" name="brandId">
            <option value="">All Brands</option>
            <option th:each="brand : ${brands}"
                    th:value="${brand.id}"
                    th:text="${brand.name}"
                    th:selected="${param.brandId != null && param.brandId == brand.id}"></option>
        </select>
    </div>

    <div>
        <label for="themeSelectForm">Theme:</label>
        <select id="themeSelectForm" name="themeId">
            <option value="">All Themes</option>
            <option th:each="theme : ${themes}"
                    th:value="${theme.id}"
                    th:text="${theme.name}"
                    th:selected="${param.themeId != null && param.themeId == theme.id}"></option>
        </select>
    </div>

    <div>
        <label for="sportSelectForm">Sport:</label>
        <select id="sportSelectForm" name="sportId">
            <option value="">All Sports</option>
            <option th:each="sport : ${sports}"
                    th:value="${sport.id}"
                    th:text="${sport.name}"
                    th:selected="${param.sportId != null && param.sportId == sport.id}"></option>
        </select>
    </div>

    <div>
        <label for="playerSelectForm">Player:</label>
        <select id="playerSelectForm" name="playerId">
            <option value="">All Players</option>
            <option th:each="player : ${players}"
                    th:value="${player.id}"
                    th:text="${player.name + ' ' + player.surname}"
                    th:selected="${param.playerId != null && param.playerId == player.id}"></option>
        </select>
    </div>

    <div>
        <label for="seasonSelectForm">Season:</label>
        <select id="seasonSelectForm" name="season">
            <option value="">All Seasons</option>
            <option th:each="s : ${seasons}"
                    th:value="${s}"
                    th:text="${s}"
                    th:selected="${param.season != null && param.season == s}"></option>
        </select>
    </div>

    <div>
        <label for="gameUsedSelectForm">Game Used Material:</label>
        <select id="gameUsedSelectForm" name="gameUsed">
            <option value="">Any</option>
            <option value="true" th:selected="${param.gameUsed == 'true'}">Yes</option>
            <option value="false" th:selected="${param.gameUsed == 'false'}">No</option>
        </select>
    </div>

    <div>
        <label for="autographSelectForm">Autograph:</label>
        <select id="autographSelectForm" name="autograph">
            <option value="">Any</option>
            <option value="true" th:selected="${param.autograph == 'true'}">Yes</option>
            <option value="false" th:selected="${param.autograph == 'false'}">No</option>
        </select>
    </div>

    <button type="submit">Filter</button>
    <a th:href="@{/cards}" class="button">Clear Filters</a>
</form>
<!-- End New Filter Form -->

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Surname</th>
        <th>Team</th> <!-- Updated to reflect the new Team relationship -->
        <th>Sport</th> <!-- Updated to reflect the new Team relationship -->
        <th>Season</th>
        <th>Company</th>
        <th>Brand</th>
        <th>Theme</th>
        <th>Variant</th>
        <th>Card Number</th>
        <th>Serial/Print Run</th>
        <th>Serial Numbered</th>
        <th>Rookie Card</th>
        <th>Game Used Material</th>
        <th>Autograph</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="card : ${cards}">
        <td th:text="${card.player.name}"></td>
        <td th:text="${card.player.surname}"></td>
        <td th:text="${card.player.team.name}"></td> <!-- Display the Team name -->
        <td th:text="${card.player.sport.name}"></td> <!-- Display the Team name -->
        <td th:text="${card.season}"></td>
        <td th:text="${card.theme.brand.manufacturer.name}"></td>
        <td th:text="${card.theme.brand.name}"></td>
        <td th:text="${card.theme.name}"></td>
        <td th:text="${card.variant.name}"></td>
        <td th:text="${card.number}"></td>
        <td th:text="${card.printRun}"></td>
        <td th:text="${card.serialNumber}"></td>
        <td th:text="${card.rookieCard ? 'Yes' : 'No'}"></td>
        <td th:text="${card.gameUsedMaterial ? 'Yes' : 'No'}"></td>
        <td th:text="${card.autograph ? 'Yes' : 'No'}"></td>


    </tr>
    </tbody>
</table>

</body>
</html>
