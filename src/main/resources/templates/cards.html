<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Juwan Howard Basketball Trading Card Collection</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#317EFB">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="194x194" href="/favicon-194x194.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#317EFB">
    <meta name="apple-mobile-web-app-title" content="Maulmann.de">
    <meta name="application-name" content="Maulmann.de">
    <meta name="msapplication-TileColor" content="#317EFB">
    <link href="/favicon.ico" rel="icon" sizes="32x32">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <meta name="description"
          content="Private Collection of Juwan Howard Basketball Trading Cards. Containing many 1/1 and rare Trading Cards from companies like: Panini, Fleer, Topps and Upper Deck. Including Super rare cards like Precious Metal Gems from the 90s">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../css/main.css" rel="stylesheet" type="text/css">
    <meta name="robots" content="index,follow">
</head>
<body>
<h1>Card Collection</h1>
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Surname</th>
        <th>Team</th> <!-- Updated to reflect the new Team relationship -->
        <th>Sport</th> <!-- Updated to reflect the new Team relationship -->
        <th>Season</th>
        <th>Company</th>
        <th>Brand</th>
        <th>Theme</th>
        <th>Variant</th>
        <th>Card Number</th>
        <th>Serial/Print Run</th>
        <th>Serial Numbered</th>
        <th>Rookie Card</th>
        <th>Game Used Material</th>
        <th>Autograph</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="card : ${cards}">
        <td th:text="${card.player.name}"></td>
        <td th:text="${card.player.surname}"></td>
        <td th:text="${card.player.team.name}"></td> <!-- Display the Team name -->
        <td th:text="${card.player.sport.name}"></td> <!-- Display the Team name -->
        <td th:text="${card.season}"></td>
        <td th:text="${card.theme.brand.manufacturer.name}"></td>
        <td th:text="${card.theme.brand.name}"></td>
        <td th:text="${card.theme.name}"></td>
        <td th:text="${card.variant.name}"></td>
        <td th:text="${card.number}"></td>
        <td th:text="${card.printRun}"></td>
        <td th:text="${card.serialNumber}"></td>
        <td th:text="${card.rookieCard ? 'Yes' : 'No'}"></td>
        <td th:text="${card.gameUsedMaterial ? 'Yes' : 'No'}"></td>
        <td th:text="${card.autograph ? 'Yes' : 'No'}"></td>


    </tr>
    </tbody>
</table>


<div>
    <label for="manufacturerSelect">Select Manufacturer:</label>
    <select id="manufacturerSelect">
        <option value="">All Manufacturers</option>
        <option th:each="manufacturer : ${manufacturers}" th:value="${manufacturer.id}" th:text="${manufacturer}"></option>
    </select>
</div>

<div id="cardsContainer">
</div>

<script>
    // Function to fetch and display cards
    function fetchCards(manufacturerId) {
        // Construct the API URL
        let url = '/api/cards';
        if (manufacturerId) {
            url += '/manufacturer/' + manufacturerId;
            alert("URL: "+url)
        }

        // Make the AJAX request
        fetch(url)
            .then(response => response.json())
            .then(cards => {
                // Clear the existing cards
                const cardsContainer = document.getElementById('cardsContainer');
                cardsContainer.innerHTML = '';

                // Create a table to display the cards
                const table = document.createElement('table');
                // ... (add table headers and rows as in the previous example)

                cardsContainer.appendChild(table);
            });
    }

    // Add event listener to the dropdown
    const manufacturerSelect = document.getElementById('manufacturerSelect');
    manufacturerSelect.addEventListener('change', () => {
        const manufacturerId = manufacturerSelect.value;
        fetchCards(manufacturerId);
    });

    // Initial fetch to display all cards
    fetchCards();
</script>

<h1>Card Details</h1>
<div id="cardDisplay">
</div>

<script>
    // ... (Your JavaScript AJAX code here)

    // Example of how to display data after fetching
    fetch('/api/cards/manufacturer/') // Or your specific API endpoint
        .then(response => response.json())
        .then(data => {
            const cardDisplay = document.getElementById('cardDisplay');
            let html = '<table>';
            html += '<thead><tr><th>Season</th><th>Number</th><th>Variant</th></tr></thead><tbody>';

            data.forEach(card => {
                html += `<tr><td><span class="math-inline">\{card\.season\}</td\><td\></span>{card.number}</td><td>${card.variant.name}</td></tr>`; // Adjust field names based on your API response
            });

            html += '</tbody></table>';
            cardDisplay.innerHTML = html;
        });
</script>

</body>
</html>
